{% extends 'partials/base.html' %}
{% block title %} 修改球隊名稱 {% endblock %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card p-4">
          <div class="card-header bg-transparent border-0 text-center pb-0">
            <div class="icon-box-lg icon-box-gold mx-auto mb-3">
              <i class="fa-solid fa-pen-to-square"></i>
            </div>
            <h3 class="fw-bold mb-1">修改球隊名稱</h3>
            <p class="text-muted small">更新此球隊名稱資訊</p>
          </div>
          <div class="card-body pt-3">
            <form method="POST">
              {% csrf_token %}
              <div class="mb-4">
                {{ hometeamform|crispy }}
              </div>
              <div class="d-flex gap-2 justify-content-end">
                <a href="{% url 'hometeam' %}" class="btn btn-secondary px-4">
                  <i class="fa-solid fa-xmark me-1"></i> 取消
                </a>
                <button type="submit" class="btn btn-warning px-4">
                  <i class="fa-solid fa-check me-1"></i> 儲存修改
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
