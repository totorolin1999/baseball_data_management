{% extends 'partials/base.html' %}
{% block title %} 刪除投球資料 {% endblock %}
{% load static %}
{% block content %}
<br>
<br>
<br>
<section id="learn" class="p-5">
    <div class="container">
      <div class="row align-items-center justify-content-between">
        <div class="col-md">
          <img src="{% static '/manager.svg' %}" class="img-fluid" alt="" />
        </div>
        <div class="col-md p-5">
            <form method="POST">
                <h2>刪除投球資料</h2>
                <br>
                {% csrf_token %}
                <p class="lead">
                    您確定要刪除「{{ pitchingvalue.player.player_name }}」的這筆投球資料嗎？
                </p>
                <a href="{% url 'pitching' cupvalue.cup_id pitchingvalue.game_id %}" class="btn btn-secondary">取消</a>
                <input class="btn btn-danger" type="submit" value="刪除">
            </form>
        </div>
      </div>
    </div>
</section>
{% endblock %}
