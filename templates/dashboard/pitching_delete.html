{% extends 'partials/base.html' %}
{% block title %} 刪除投球資料 {% endblock %}
{% load static %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card p-4 border-danger border-opacity-50">
          <div class="card-header bg-transparent border-0 text-center pb-0">
            <div class="icon-box-lg mx-auto mb-3" style="background: rgba(239, 68, 68, 0.12); color: #f87171; border-color: rgba(239, 68, 68, 0.3);">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="fw-bold text-danger mb-2">確認刪除投手成績？</h3>
            <p class="text-muted">您確定要刪除「{{ pitchingvalue.player.player_name }}」此場比賽的投球記錄嗎？</p>
          </div>
          <div class="card-body pt-2 text-center">
            <form method="POST">
              {% csrf_token %}
              <div class="d-flex gap-3 justify-content-center mt-4">
                <a href="{% url 'pitching' cupvalue.cup_id pitchingvalue.game_id %}" class="btn btn-secondary px-4">
                  <i class="fa-solid fa-arrow-left me-1"></i> 取消返回
                </a>
                <button type="submit" class="btn btn-danger px-4">
                  <i class="fa-solid fa-trash-can me-1"></i> 確認刪除
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
